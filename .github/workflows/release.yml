# Publish only after a maintainer explicitly dispatches this workflow on main.
# Historical releases, tags and branches are never deleted or overwritten.
name: LunaTOC-SC manual release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'I approve publishing a new GitHub pre-release from main'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: luna-toc-manual-release
  cancel-in-progress: false

jobs:
  verify:
    name: Re-run verification before release
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish pre-release (explicit approval only)
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified ZIP
        uses: actions/download-artifact@v8
        with:
          name: luna-toc-sc-chrome

      - name: Verify downloaded package
        run: |
          sha256sum -c luna-toc-sc-chrome.zip.sha256
          unzip -tq luna-toc-sc-chrome.zip
          unzip -Z1 luna-toc-sc-chrome.zip | grep -Fxq manifest.json

      - name: Publish immutable GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")"
          tag="v${version}-preview.${COMMIT_SHA:0:12}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$tag" \
            luna-toc-sc-chrome.zip \
            luna-toc-sc-chrome.zip.sha256 \
            --target "$COMMIT_SHA" \
            --title "LunaTOC-SC v${version} (${COMMIT_SHA:0:12})" \
            --prerelease \
            --notes "Chrome extension built and verified from main at ${COMMIT_SHA}. Download luna-toc-sc-chrome.zip, extract, and load via chrome://extensions (Developer mode). Previous Releases and Git tags are preserved. This is a development preview, not a Chrome Web Store package."
