# Build verification only. This workflow never publishes or deletes releases.
name: LunaTOC-SC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: luna-toc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check workflow safety policy
        run: node scripts/check-workflow-policy.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build

      - name: Verify built extension files
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from 'node:fs';
          import { resolve, relative, isAbsolute } from 'node:path';

          const dist = resolve('dist');
          const manifestPath = resolve(dist, 'manifest.json');
          if (!existsSync(manifestPath)) {
            throw new Error('dist/manifest.json is missing');
          }
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          if (manifest.manifest_version !== 3) {
            throw new Error('Expected a Manifest V3 extension');
          }

          const files = [
            ...Object.values(manifest.icons ?? {}),
            ...Object.values(manifest.action?.default_icon ?? {}),
            manifest.action?.default_popup,
            manifest.options_ui?.page,
            manifest.background?.service_worker,
            manifest.side_panel?.default_path,
            ...(manifest.content_scripts ?? []).flatMap((script) => [
              ...(script.js ?? []),
              ...(script.css ?? []),
            ]),
          ].filter(Boolean);

          if (files.length === 0) {
            throw new Error('No extension assets were declared');
          }
          for (const file of files) {
            const target = resolve(dist, file);
            const pathFromDist = relative(dist, target);
            if (pathFromDist.startsWith('..') || isAbsolute(pathFromDist) ||
                !existsSync(target) || !statSync(target).isFile()) {
              throw new Error(`Missing or invalid extension asset: ${file}`);
            }
          }
          console.log(`Manifest V3 validated with ${files.length} referenced assets`);
          NODE

      - name: Create ready-to-load ZIP
        run: |
          (cd dist && zip -q -r ../luna-toc-sc-chrome.zip .)
          unzip -tq luna-toc-sc-chrome.zip
          unzip -Z1 luna-toc-sc-chrome.zip | grep -Fxq manifest.json
          sha256sum luna-toc-sc-chrome.zip > luna-toc-sc-chrome.zip.sha256
          sha256sum -c luna-toc-sc-chrome.zip.sha256

      - name: Check extension privilege boundaries and license metadata
        run: npm run test:security

      - name: Install isolated Chromium test runner
        run: npm run test:browser:setup

      - name: Run headless Chromium extension tests
        run: npm run test:browser

      - name: Preserve browser and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-stage09-audit
          path: |
            artifacts/browser/
            artifacts/security/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-toc-sc-chrome
          path: |
            luna-toc-sc-chrome.zip
            luna-toc-sc-chrome.zip.sha256
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency advisory gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject known high and critical dependency advisories
        run: npm audit --audit-level=high


  remediation_probe:
    name: Temporary read-only dependency remediation probe
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate non-forced dependency upgrade proposal without repository writes
        shell: bash
        run: |
          cp package-lock.json "$RUNNER_TEMP/original-lock.json"
          npm uninstall shadcn --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/after-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const original=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/original-lock.json','utf8'));
          const next=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const audit=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/after-audit.json','utf8'));
          const removed=Object.keys(original.packages).filter(k=>!(k in next.packages));
          const updated=Object.fromEntries(Object.entries(next.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(original.packages[k])));
          const changed={packageJson:pkg,removed,updated};
          const compressed=JSON.stringify(changed);
          console.log('PROBE_SUMMARY',JSON.stringify({removed:removed.length,updated:Object.keys(updated).length,remainingVulnerabilities:audit.metadata?.vulnerabilities??'unknown',size:compressed.length}));
          for(let i=0;i<compressed.length;i+=1600)console.log('PROBE_PATCH_'+String(i/1600).padStart(4,'0')+'_'+compressed.slice(i,i+1600));
          console.log('PROBE_REMAINING',JSON.stringify(Object.keys(audit.vulnerabilities??{})));
          NODE
